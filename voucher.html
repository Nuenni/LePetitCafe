<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voucher · Le Petit Café</title>
<style>
:root {
  --grund:    #15171c;
  --papier:   #f6f4ef;
  --tinte:    #302c28;
  --text:     #e8eaee;
  --gedaempft:#8b91a0;
  --kante:    #2b2f39;
  --ui: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--grund);
  color: var(--text);
  font-family: var(--ui);
  min-height: 100dvh;
  display: flex; align-items: center; justify-content: center;
  padding: 24px;
}
.karte {
  width: 100%; max-width: 380px;
  background: var(--papier);
  color: var(--tinte);
  border-radius: 20px;
  padding: 40px 28px;
  text-align: center;
  box-shadow: 0 20px 60px rgba(0,0,0,.5);
}
.eyebrow {
  font-size: .7rem; letter-spacing: .22em; text-transform: uppercase;
  color: #8a7f6a; margin-bottom: 22px;
}
.emoji { font-size: 3.6rem; line-height: 1; margin-bottom: 18px; }
.label {
  font-size: .78rem; letter-spacing: .18em; text-transform: uppercase;
  color: #8a7f6a; margin-bottom: 10px;
}
.text {
  font-size: clamp(1.3rem, 6vw, 1.7rem); font-weight: 800;
  letter-spacing: -.01em; text-wrap: balance; line-height: 1.25;
}
.foot {
  margin-top: 26px; font-size: .78rem; color: #8a7f6a;
}
.hint {
  margin-top: 18px; font-size: .85rem; color: var(--gedaempft);
  max-width: 320px;
}
</style>
</head>
<body>

<div id="target">
  <div class="karte">
    <div class="eyebrow">Le Petit Café</div>
    <div class="emoji" id="emoji">🎟️</div>
    <div class="label" id="label">Voucher</div>
    <div class="text" id="text">Loading …</div>
    <div class="foot" id="foot">Redeem with Mom or Dad</div>
  </div>
</div>

<script>
async function showVoucher() {
  const params = new URLSearchParams(location.search);
  const id     = params.get("g");
  const joke   = params.get("w");
  const emojiEl = document.getElementById("emoji");
  const labelEl = document.getElementById("label");
  const textEl  = document.getElementById("text");
  const footEl  = document.getElementById("foot");

  // Jokes need no database: the text rides along in the URL that the
  // printer writes into the QR code.
  if (joke) {
    emojiEl.textContent = "😄";
    labelEl.textContent = "Joke of the Day";
    textEl.textContent = joke;
    footEl.remove();
    return;
  }

  if (!id) {
    textEl.textContent = "No voucher specified.";
    return;
  }

  try {
    const response = await fetch("vouchers.json");
    const vouchers = await response.json();
    const voucher = vouchers.find(v => v.id === id);

    if (!voucher) {
      textEl.textContent = "This voucher was not found.";
      return;
    }

    emojiEl.textContent = voucher.emoji || "🎟️";
    textEl.textContent = voucher.en;
  } catch (error) {
    textEl.textContent = "Could not load voucher.";
    document.querySelector(".karte").insertAdjacentHTML(
      "beforeend",
      '<div class="hint">Please retry with an internet connection.</div>'
    );
  }
}
showVoucher();
</script>

</body>
</html>
