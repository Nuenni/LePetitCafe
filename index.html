<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>LePetitCafe</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: #1a1a2e;
  font-family: -apple-system, 'Segoe UI', sans-serif;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 32px;
  padding: 40px 24px;
}
.logo {
  text-align: center;
}
.logo h1 {
  font-size: 1.8rem;
  font-weight: 800;
  color: #fff;
  letter-spacing: 3px;
  text-transform: uppercase;
}
.logo p {
  color: #ffffff50;
  font-size: .8rem;
  letter-spacing: 2px;
  margin-top: 6px;
  text-transform: uppercase;
}
.cards {
  display: flex;
  flex-direction: column;
  gap: 16px;
  width: 100%;
  max-width: 340px;
}
.card {
  display: flex;
  align-items: center;
  gap: 18px;
  background: #ffffff0d;
  border: 1px solid #ffffff15;
  border-radius: 20px;
  padding: 20px 24px;
  text-decoration: none;
  transition: background .15s, transform .1s;
  cursor: pointer;
}
.card:active { background: #ffffff1a; transform: scale(.98); }
.card-icon { font-size: 2rem; flex-shrink: 0; }
.card-text h2 { color: #fff; font-size: 1rem; font-weight: 700; }
.card-text p  { color: #ffffff60; font-size: .78rem; margin-top: 2px; }
.card-arrow   { color: #ffffff30; font-size: 1.2rem; margin-left: auto; }

.card-de { border-color: #c0392b40; }
.card-de:active { background: #c0392b15; }
.card-en { border-color: #2e86c140; }
.card-en:active { background: #2e86c115; }

.footer {
  color: #ffffff20;
  font-size: .65rem;
  letter-spacing: 2px;
  text-transform: uppercase;
  text-align: center;
}
</style>
</head>
<body>

<div class="logo">
  <h1>🧾 LePetitCafe</h1>
  <p>Receipt Printer Simulator</p>
</div>

<div class="cards">
  <a class="card card-de" href="simulator.html">
    <span class="card-icon">🇩🇪</span>
    <div class="card-text">
      <h2>Deutsche Version</h2>
      <p>Petit Marché · Le Petit Café · Le Petit Bistro</p>
    </div>
    <span class="card-arrow">›</span>
  </a>
  <a class="card card-en" href="simulator_en.html">
    <span class="card-icon">🇬🇧</span>
    <div class="card-text">
      <h2>English Version</h2>
      <p>The Little Market · Café · Bistro</p>
    </div>
    <span class="card-arrow">›</span>
  </a>
</div>

<p class="footer">github.com/nuenni/lepetitcafe</p>

</body>
</html>
